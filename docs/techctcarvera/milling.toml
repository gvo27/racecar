available_not_in_cam = "Makera PCB bit pack: 60 deg V-bit, 0.1 mm tip (cut 0.192 mm at 0.08 mm depth). The lab CAM does not use it, so the milling check does not use it (removed from [[isolation_bit]] 2026-11-15, Fable review)."
face = "T5 chamfer mill '0.3mm Tip Solder Mask Removal': tip 0.3 mm, taper 15 deg per side, 6000 rpm, feed 400, stepover 0.2 mm"
