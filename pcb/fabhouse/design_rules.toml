# Design rules of the rev A board (fab house quality). Format and keys: pcb/tools/rules.py, docs in docs/pcb/README.md.
# These are the values of the rev A design. `make pcb-rules BOARD=fabhouse` checks that the KiCad project files agree.
# The mill prototype uses a different file: design_rules.toml in the lab directory.

[horizontal_error]
value = 0.0
unit = "mm"
status = "confirmed"
source = "rev A design: no allowance for a horizontal error of the mill"

[cut_spacing_min]
value = 0.9
unit = "mm"
status = "confirmed"
source = "rev A design: track_min 0.5 + clearance 0.4"

[clearance]
value = 0.4
unit = "mm"
status = "confirmed"
source = "rc_power_board.kicad_pro, all net classes (.claude/rules/schematics.md)"

[track_min]
value = 0.5
unit = "mm"
status = "confirmed"
source = "rc_power_board.kicad_pro min_track_width"

[zone_min_width]
value = 0.5
unit = "mm"
status = "confirmed"
source = "build_pcb.py add_zone (rev A)"

[zone_clearance]
value = 0.4
unit = "mm"
status = "confirmed"
source = "build_pcb.py add_zone (rev A)"

[component_gap]
value = 0.0
unit = "mm"
status = "confirmed"
source = "rev A design: no minimum courtyard gap (0 = no check). Courtyards must not overlap"

[module_gap]
value = 1.5
unit = "mm"
status = "confirmed"
source = "check_board.py MODULE_GAP_MM (rev A): body gap >= 2.0 mm, +-0.3 mm edge tolerance, heat"

[edge_clearance]
value = 0.5
unit = "mm"
status = "confirmed"
source = "rc_power_board.kicad_pro min_copper_edge_clearance"

[edge_band]
value = 2.0
unit = "mm"
status = "confirmed"
source = "route_pcb.py EDGE_BAND (rev A): the router keeps tracks out of this band along the outline"

[annular_min]
value = 0.45
unit = "mm"
status = "confirmed"
source = "rc_power_board.kicad_pro min_via_annular_width"

[netclass.Default]
track_width = 0.5
status = "confirmed"
source = "rc_power_board.kicad_pro"

[netclass.HighCurrent]
track_width = 6.0
status = "confirmed"
source = "rc_power_board.kicad_pro (*VBAT*, GND)"

[netclass.Power3A]
track_width = 1.0
status = "confirmed"
source = "rc_power_board.kicad_pro (*+6V_BEC)"

[netclass.Power5A]
track_width = 1.6
status = "confirmed"
source = "rc_power_board.kicad_pro (+5V_CPU, +5V_SENS)"

[[exception]]
ref = "U3"
clearance = 0.3
reason = "AP2112K, SOT-23-5: the gap between its own pads is 0.35 mm. Rule U3_fine, owner decision 2026-11-11"
