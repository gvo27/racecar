name: python

on:
  push:
    paths:
      - "tools/**"
      - "tuning.toml"
      - "requirements.txt"
      - "pyrightconfig.json"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "tools/**"
      - "tuning.toml"
      - "requirements.txt"
      - "pyrightconfig.json"
      - ".github/workflows/python.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps into .venv
        run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
      - name: Unit tests (no hardware)
        run: make unit PORT=
