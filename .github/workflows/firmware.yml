name: firmware

on:
  push:
    paths:
      - "firmware/**"
      - "rccar_msgs/**"
      - "docker/firmware.Dockerfile"
      - "docker/firmware.Dockerfile.dockerignore"
      - "Makefile"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "rccar_msgs/**"
      - "docker/firmware.Dockerfile"
      - "docker/firmware.Dockerfile.dockerignore"
      - "Makefile"
      - ".github/workflows/firmware.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        env: [esp32s3, esp32s3_ascii]   # micro-ROS (default) and legacy ASCII
    steps:
      - uses: actions/checkout@v4

      # micro-ROS library is colcon-built into .pio/libdeps on the first `pio run` (~10 min, network).
      # make build keeps libdeps, so cache it. Key: everything that changes the library build.
      - name: Cache micro-ROS libdeps
        uses: actions/cache@v4
        with:
          path: firmware/esp32/.pio/libdeps
          key: libdeps-${{ matrix.env }}-${{ hashFiles('firmware/esp32/platformio.ini', 'firmware/esp32/rccar.meta', 'firmware/esp32/extra_packages/**') }}

      # image pre-installs the PlatformIO packages; the default named volume
      # (rccar-platformio-v2) is seeded from it, so the build needs no extra download
      - name: Build firmware image
        run: make fw-image

      - name: Build firmware in container
        run: make build FW_ENV=${{ matrix.env }}

      - name: Upload firmware.bin
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.env }}
          path: firmware/esp32/.pio/build/${{ matrix.env }}/firmware.bin
          if-no-files-found: error
