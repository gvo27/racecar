# path -> role/owner/rules/invariants. phase: 1,2,4(lidar, rangefinder)=exist now (2 = bench-verified), 3+=planned. COLCON_IGNORE marks non-ros dirs.
paths:
  firmware/esp32/: {role: esp32 platformio project; single env esp32s3 (micro-ros), owner: firmware, rules: [.claude/rules/firmware.md, .claude/rules/msgs.md], colcon_ignore: true, phase: 1, invariants: [pins.h == README table, "protocol/interface change => rccar_msgs + extra_packages + main.cpp + rccar_mcu_bridge + docs"]}
  firmware/esp32/extra_packages/rccar_msgs/: {role: synced copy of rccar_msgs for the micro-ros lib build; never edit here (ci diff -r), rules: .claude/rules/msgs.md, phase: 2}
  firmware/esp32/rccar.meta: {role: micro-ros entity limits (rmw_microxrcedds; 3 publishers), rules: .claude/rules/firmware.md, phase: 2}
  firmware/esp32/include/pins.h: {role: pin ssot, rules: .claude/rules/firmware.md}
  firmware/esp32/include/rangefinder.h: {role: device-agnostic rangefinder driver interface, rules: .claude/rules/rangefinder.md, phase: 4}
  firmware/esp32/src/rangefinder_lidar_lite_v4.cpp: {role: Garmin LIDAR-Lite v4 LED I2C protocol (only place with device registers), rules: .claude/rules/rangefinder.md, phase: 4}
  firmware/esp32/src/main.cpp: {role: "firmware main: control task, McuCommand grammar (handleLine, setKey), micro-ros comms layer"}
  docker/firmware.Dockerfile: {role: firmware toolchain image rccar-fw (platformio+esptool pinned), rules: .claude/rules/dependencies.md, phase: 1}
  docker/ros.Dockerfile: {role: "ros jazzy image, stages builder/test/runtime; base ros:jazzy-ros-base by digest; rosdep+colcon --merge-install; ROSDEP_INSTALL=0 only for offline builds", rules: .claude/rules/dependencies.md, phase: 2}
  docker/ros.Dockerfile.dockerignore: {role: build-context filter for ros.Dockerfile, phase: 2}
  docker/entrypoint.sh: {role: sources /opt/ros/jazzy + /ws/install then exec, phase: 2}
  docker/ros-test.sh: {role: colcon test + test-result in the test stage; copies log/xml to /out, phase: 2}
  docker/: {role: toolchain dockerfiles, rules: [.claude/rules/dependencies.md, .claude/rules/deploy.md], colcon_ignore: true, phase: 1}
  tuning.toml:
    role: "runtime tuning ssot"
    sections: [link, control, safety, steering, steering.calibration, throttle, throttle.calibration, logging, warmup, battery, imu, rangefinder, encoder]
    confirmed_platform: ["platform.pi5: esp32_device, arch"]
    planned_sections: [models, supervisor, more platform keys]
    rules: .claude/rules/tuning.md
    invariants: [no unconfirmed parameters, "key change => tuning.toml + rccar_mcu_bridge.tuning.FIRMWARE_KEYS + main.cpp setKey (test-enforced by rccar_mcu_bridge/test/test_tuning.py)"]
  Makefile: {role: entry point; no host python: car-*/ros-*/mcu/teleop via compose+docker, config via ros image, unit via ros test image, fw targets via docker (FW_ENV), rules: .claude/rules/dependencies.md}
  .env.example: {role: template for gitignored .env (TZ ROS_DOMAIN_ID PLATFORM TS_DOMAIN ADMIN_TS_HOST BACKUP_DEST), rules: .claude/rules/deploy.md}
  .env: {role: secrets + private names, gitignored}
  models/: {role: manifest.yaml + README committed; cache/ gitignored, rules: .claude/rules/models.md, colcon_ignore: true, phase: 1}
  repos/: {role: rccar.repos vcstool manifest (third-party only) + README, rules: .claude/rules/repos.md, colcon_ignore: true, phase: 1}
  logs/: {role: runtime data (jsonl logs, snapshots, bags), fully gitignored except .gitkeep + COLCON_IGNORE (maps = private floor plans; public repo), mounted rw into core/tools, colcon_ignore: true}
  build/: {role: make ros-test output (log + xml), gitignored}
  docs/: {role: setup.md, docker_ros_plan.md, esp32-firmware-proposal.md, tuning-notes.txt, colcon_ignore: true}
  docs/sensor_contract.md: {role: "hardware-boundary ssot: topics, types, frames, qos, tf, device facts; racecar-sim copies it", rules: .claude/skills/sim-parity/SKILL.md, invariants: ["active rows == code (deploy/tests/test_contract.py)", "boundary change => contract + Sim impact PR section"]}
  .claude/skills/sim-parity/: {role: project skill; boundary change -> contract rows + racecar-sim artifacts + Sim impact}
  docs/datasheets/: {role: "archived datasheets + summaries (ds3225_servo.md, thw-1060-brushed-esc.md, rangefinder_lidar_lite_v4.md) + components_list.xlsx (ground truth inventory)", rules: .claude/rules/rangefinder.md}
  .github/pull_request_template.md: {role: PR body template incl. user-run bench checklist (deploy + feature checks), rules: .claude/rules/claude-tooling.md, phase: 4}
  .github/workflows/firmware.yml: {role: ci firmware build env esp32s3 in container, libdeps cache, firmware.bin artifact, phase: 1}
  .claude/: {role: CLAUDE.md, layout.yaml, rules/*.md, agents/*.md, settings.json}
  .claude/rules/rangefinder.md: {role: rangefinder wiring, names, invariants, sensor-swap recipe; links all rangefinder docs, rules: .claude/rules/claude-tooling.md, phase: 4}
  .claude/agents/ros2-reviewer.md: {role: project subagent; reviews diffs vs rules + ros2-engineering refs + stop-path checklist, phase: 2}
  .claude/settings.json: {role: project claude plugins + mcp enablement, rules: [.claude/rules/dependencies.md, .claude/rules/claude-tooling.md], phase: 1}
  pyrightconfig.json: {role: pyright-lsp config (include rccar_* + deploy; missing imports = warning since rclpy/rccar_msgs only exist in the ROS image), location: repo root (required), rules: .claude/rules/claude-tooling.md, phase: 1}
  firmware/esp32/.clangd: {role: clangd flags for xtensa; db from make compiledb (gitignored compile_commands.json, .pio-core/), rules: .claude/rules/claude-tooling.md, phase: 1}
  deploy/tests/: {role: "pytest for deploy/render_env.py, hw_guard, test_contract (sensor_contract.md vs code), test_rules_paths (every rule has paths: and each glob matches) (make unit: ros test image; ci ros.yml)", rules: .claude/rules/claude-tooling.md, phase: 2}
  .github/workflows/ros.yml: {role: ci ros image build + colcon test + deploy/tests (build-test), advisory ros2-engineering validators (ros2-static), rccar_msgs sync check (interfaces-sync), rules: .claude/rules/ros2.md, phase: 2}
  docs/plans/: {role: superpowers writing-plans output, rules: .claude/rules/claude-tooling.md}
  deploy/: {role: deploy files + render_env.py (make config, runs in ros image) + tests/, colcon_ignore: true, rules: .claude/rules/deploy.md, phase: 2}
  deploy/car/compose.yaml: {role: services mcu-agent (digest-pinned micro-ros-agent), core (bringup), drivers (lidar, phase 4), tools (profile); x-logging, hardening, heartbeat healthcheck, rules: .claude/rules/deploy.md, phase: 2}
  deploy/car/99-rccar.rules: {role: "udev ch343 1a86:55d3 -> /dev/rccar-esp32 group dialout, installed by make install-host", phase: 2}
  deploy/car/rccar.service: {role: systemd template (@REPO_DIR@ @USER@); compose up -d at boot, phase: 2}
  deploy/car/.env.generated: {role: rendered by make config from .env + tuning.toml platform.$PLATFORM table; gitignored, phase: 2}
  deploy/render_env.py: {role: stdlib renderer for .env.generated (args --repo-dir --dialout-gid from make); tests in deploy/tests (make unit), phase: 2}
  rccar_msgs/: {role: msgs/srvs contract (DriveCmd Telemetry McuEvent SupervisorState; McuCommand Reset SetParam CalPoint RawPwm); bounded strings, rules: .claude/rules/msgs.md, phase: 2, invariants: ["change => firmware extra_packages copy + main.cpp + rccar_mcu_bridge + docs"]}
  rccar_mcu_bridge/: {role: "lifecycle node /mcu_bridge: typed services over /rccar/mcu/command, tuning push on activation + READY, FIRMWARE_KEYS", rules: [.claude/rules/mcu_bridge.md, .claude/rules/ros2.md], phase: 2}
  rccar_bringup/: {role: car.launch.py (use_sim_time, sim, tuning_file, heartbeat_dir); tuning.toml -> params, rules: [.claude/rules/tuning.md, .claude/rules/ros2.md], phase: 2}
  rccar_supervisor/: {role: "safety authority: arbiter, latched stop, arm/disarm/brake services; sole publisher of /rccar/mcu/drive", rules: [.claude/rules/supervisor.md, .claude/rules/ros2.md], phase: 2}
  rccar_teleop/: {role: admin keyboard teleop (ssh), rules: [.claude/rules/calibration.md, .claude/rules/ros2.md], phase: 2}
  rccar_calibration/: {role: calibrate, bench_test, tune, rangefinder_monitor + lidar_imu_monitor + lidar_snapshot + lidar_record clis (ros2 run; make rangefinder, make lidar-imu, make lidar-snapshot, make lidar-record), rules: [.claude/rules/calibration.md, .claude/rules/ros2.md], phase: 2}
  rccar_description/: {role: "urdf/xacro base_link, lidar_link, lidar_imu_link for rsp; mount offsets UNMEASURED until user measures", rules: [.claude/rules/drivers.md, .claude/rules/ros2.md], phase: 4}
  rccar_drivers/: {role: "lifecycle node mapper_driver (Slamtec Mapper M2M1 over TCP 1445) + slamtec/* protocol/convert library; exists now (branch lidar, bench pending)", rules: [.claude/rules/drivers.md, .claude/rules/ros2.md], phase: 4}
  rccar_bringup/launch/drivers.launch.py: {role: "robot_state_publisher + mapper_driver (auto configure/activate), used by compose service drivers; urdf_file:= (sim wrapper xacro)", rules: .claude/rules/drivers.md, phase: 4}
  rccar_bringup/launch/viz.launch.py: {role: foxglove_bridge websocket, 127.0.0.1:8765 default, topic whitelist; make viz, rules: .claude/rules/drivers.md, phase: 4}
  rccar_drivers/test_hw/: {role: "hardware acceptance launch_testing vs the PHYSICAL lidar (make lidar-hw-test); NOT collected by colcon test (conftest needs RCCAR_HW_TEST=1); installed to share/rccar_drivers/test_hw", rules: .claude/rules/hw-testing.md, phase: 4}
  rccar_drivers/rccar_drivers/hw_criteria.py: {role: pass/fail thresholds + eval functions for the hw test (pure, pytest test/test_hw_criteria.py), rules: .claude/rules/hw-testing.md, phase: 4}
  .claude/hooks/: {role: hw_guard.py PreToolUse hook (ask before hardware restarts; deny driver edits/rebuilds while drivers runs); tests deploy/tests/test_hw_guard.py, rules: .claude/rules/hw-testing.md, phase: 4}
  logs/hw_test_lidar_*.json: {role: make lidar-hw-test report (gitignored), phase: 4}
  logs/lidar_imu_*.jsonl: {role: per-run log of make lidar-imu (gitignored via logs/), phase: 4}
  logs/lidar_snapshot_<UTC>/: {role: make lidar-snapshot output (map.png + json + summary.txt; agent-readable debug data, gitignored), phase: 4}
  logs/lidar_bag_<UTC>/: {role: make lidar-record rosbag2 mcap of the lidar topics (gitignored), phase: 4}
  rccar_recorder/: {role: mcap bags to /data, phase: 3}
  rccar_backup/: {role: upload when disarmed+idle, phase: 3}
  rccar_captain/: {role: central orchestrator, phase: 5}
  rccar_perception/: {role: perception, phase: 5}
  rccar_inference/: {role: model inference, phase: 5}
