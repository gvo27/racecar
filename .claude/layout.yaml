# path -> role/owner/rules/invariants. phase: 1=exists now, 2+=planned. COLCON_IGNORE marks non-ros dirs.
paths:
  firmware/esp32/: {role: esp32 platformio project, owner: firmware, rules: .claude/rules/firmware.md, colcon_ignore: true, phase: 1, invariants: [pins.h == README table, protocol change => main.cpp + rccar.py + docs]}
  firmware/esp32/include/pins.h: {role: pin ssot, rules: .claude/rules/firmware.md}
  firmware/esp32/src/main.cpp: {role: "firmware main: control task, ascii protocol, setKey"}
  docker/firmware.Dockerfile: {role: firmware toolchain image rccar-fw (platformio+esptool pinned), rules: .claude/rules/dependencies.md, phase: 1}
  docker/ros.Dockerfile: {role: ros jazzy runtime image, rules: .claude/rules/dependencies.md, phase: 2}
  docker/: {role: toolchain dockerfiles, rules: [.claude/rules/dependencies.md, .claude/rules/deploy.md], colcon_ignore: true, phase: 1}
  tools/: {role: host cli (rccar.py, esp32_session.py); deleted after phase 2 parity, colcon_ignore: true, phase: 1, rules: .claude/rules/firmware.md}
  tuning.toml:
    role: "runtime tuning ssot"
    sections: [link, control, safety, steering, steering.calibration, throttle, throttle.calibration, logging, warmup, battery, imu, distance, encoder]
    planned_sections: [platform.*, models, supervisor]
    invariants: [no unconfirmed parameters, "key change => tuning.toml + FIRMWARE_KEYS + main.cpp setKey"]
  requirements.txt: {role: host python deps for .venv; removed after phase 2 parity, rules: .claude/rules/dependencies.md}
  Makefile: {role: entry point; fw targets via docker, host-python targets via .venv, rules: .claude/rules/dependencies.md}
  .env.example: {role: template for gitignored .env (TZ PLATFORM TS_DOMAIN ADMIN_TS_HOST BACKUP_DEST), rules: .claude/rules/deploy.md}
  .env: {role: secrets + private names, gitignored}
  models/: {role: manifest.yaml + README committed; cache/ gitignored, rules: .claude/rules/models.md, colcon_ignore: true, phase: 1}
  repos/: {role: rccar.repos vcstool manifest (third-party only) + README, rules: .claude/rules/repos.md, colcon_ignore: true, phase: 1}
  logs/: {role: session jsonl, gitignored, colcon_ignore: true}
  docs/: {role: setup.md, docker_ros_plan.md, esp32-firmware-proposal.md, tuning-notes.txt, colcon_ignore: true}
  docs/datasheets/: {role: archived datasheets + components_list.xlsx (ground truth inventory)}
  .github/workflows/firmware.yml: {role: ci firmware build in container + firmware.bin artifact, phase: 1}
  .claude/: {role: CLAUDE.md, layout.yaml, rules/*.md, settings.json}
  .claude/settings.json: {role: project claude plugins + mcp enablement, rules: [.claude/rules/dependencies.md, .claude/rules/claude-tooling.md], phase: 1}
  .mcp.json: {role: project mcp servers (context7), rules: .claude/rules/claude-tooling.md, phase: 1}
  pyrightconfig.json: {role: pyright-lsp config (tools/, .venv), rules: .claude/rules/claude-tooling.md, phase: 1}
  firmware/esp32/.clangd: {role: clangd flags for xtensa; db from make compiledb (gitignored compile_commands.json, .pio-core/), rules: .claude/rules/claude-tooling.md, phase: 1}
  tools/tests/: {role: pytest host unit tests (make unit, ci python.yml); moves into ros packages in phase 2, rules: .claude/rules/claude-tooling.md, phase: 1}
  .github/workflows/python.yml: {role: ci host-python unit tests, phase: 1}
  docs/plans/: {role: superpowers writing-plans output, rules: .claude/rules/claude-tooling.md}
  deploy/car/: {role: compose.yaml, systemd unit, udev rules, colcon_ignore: true, rules: .claude/rules/deploy.md, phase: 2}
  rccar_msgs/: {role: msgs/srvs/actions contract, phase: 2, invariants: [msg/srv change => rccar_msgs + firmware + docs]}
  rccar_mcu_bridge/: {role: micro-ros agent launch, FIRMWARE_KEYS, tuning push, phase: 2}
  rccar_bringup/: {role: launch; tuning.toml -> ros params, phase: 2}
  rccar_supervisor/: {role: safety authority; arbitration, arm/disarm, e-stop, phase: 2}
  rccar_teleop/: {role: admin keyboard teleop, phase: 2}
  rccar_calibration/: {role: interactive calibration clis, phase: 2}
  rccar_description/: {role: urdf + tf, phase: 4}
  rccar_drivers/: {role: sensor drivers, phase: 4}
  rccar_recorder/: {role: mcap bags to /data, phase: 3}
  rccar_backup/: {role: upload when disarmed+idle, phase: 3}
  rccar_captain/: {role: central orchestrator, phase: 5}
  rccar_perception/: {role: perception, phase: 5}
  rccar_inference/: {role: model inference, phase: 5}
