# Hardware facts for the mounts (mm). Every table has status and source. Frame: docs/mechanical/conventions.md
# (X forward, Y left, Z up, origin = center of the four body posts at ground level).
# Measure list for the owner: docs/mechanical/handoff.md. An assumed value stays assumed until a measurement confirms it.

# ---- boards -----------------------------------------------------------------------------------------------------
[pcb_rev3]
# outline and M3 holes are read from this file at run time (rccar_mech.kicad), not copied here
board = "pcb/src/rc_power_board.kicad_pcb"
thickness = 1.57
status = "confirmed"
source = "board file (Edge.Cuts outline and MountingHole footprints, read at run time); thickness: docs/pcb/fab_handoff.md (1.57 mm stock)"

[pcb_rev3_heights]
# top: tallest part above the board top (Pololu modules on headers, 10 mm radial C1). bottom: solder joints and wires
top = 22.0
bottom = 3.0
# standoff: B.Cu is bare copper with VBAT_RAW, it faces the chassis (proposal in docs/pcb/fab_handoff.md, not approved)
standoff_min = 5.0
status = "assumed"
source = "estimate 2026-11-28: no 3D model of the Pololu modules; owner to measure the tallest part and the solder side"

[pi5]
length = 85.0
width = 56.0
hole_d = 2.7
hole_dx = 58.0
hole_dy = 49.0
hole_inset = 3.5
pad_d = 6.0
port_overhang = 3.0
status = "confirmed"
source = "docs/datasheets/compute_raspberry_pi5.md (product brief p.3; the drawing says approximate)"

[pi5_heights]
thickness = 1.6
top = 17.0
bottom = 3.0
status = "assumed"
source = "estimate: USB/Ethernet stack about 17 mm, parts under the board about 3 mm; read the official STEP model or measure"

# ---- chassis (Tamiya TT-02, kit 58716) ----------------------------------------------------------------------------
[tt02]
wheelbase = 257.0
status = "confirmed"
source = "Tamiya kit page 58716 (wheelbase 257 mm, 251 mm in the short setting)"

[body_posts]
# center to center. base_z: top of the stay that holds the post. top_z: post top
spacing_x = 240.0
spacing_y = 66.0
diameter = 6.0
base_z = 50.0
top_z = 110.0
status = "assumed"
source = "L-R about 65-67 mm (third-party TT-02 body-mount stiffeners); F-R, heights and diameter estimated 2026-11-28; owner to measure"

[battery]
# 2S hard-case pack in the left side of the tub, top load, held by holder bar D1 and two snap pins
length = 139.0
width = 47.0
height = 25.0
center_x = 0.0
center_y = 22.0
bottom_z = 8.0
status = "assumed"
source = "bay about 138 x 47 x 25 mm (third-party fit reports); position and floor height estimated 2026-11-28; owner to measure"

[battery_holder]
# holder bar D1 across the pack top, and the tops of its two snap pins (posts at the pack ends)
bar_top_z = 37.0
pin_top_z = 45.0
pin_x = 75.0
status = "assumed"
source = "Tamiya TT-02 manual step 36 (layout); heights estimated 2026-11-28; owner to measure"

[motor_plate]
# 4 x M3 screw holes on a square pattern in the motor plate above the motor. clearance_d: the hole of the fitted part
pattern = 24.0
clearance_d = 3.4
status = "confirmed"
source = "owner 2026-11-27: measured reference part Arduino_Mega_holder_Top_v2.stl (4 x 3.4 mm holes, 24 x 24 mm, screwed to the motor plate)"

[motor_plate_position]
# center of the 4-hole pattern in the car frame, and the top of the motor plate above the ground
x = -35.0
y = -27.0
top_z = 40.0
status = "assumed"
source = "x, y: estimate from the reference part (plate symmetric about the car center line, 2 x 2 mm holes taken as the rear body posts (a weak guess: the posts are 6 mm), body-post spacing of [body_posts]); top_z estimated 2026-11-27; owner to measure"

# ---- sensors -------------------------------------------------------------------------------------------------------
[mapper]
body = 57.0
height = 74.9
base_hole_spacing = 24.0
status = "confirmed"
source = "docs/datasheets/slamtec_mapper_M2M1_datasheet.md (body about 57 x 57 mm, 74.9 mm tall, 2 x M3 under, 24 mm apart)"

[wheels]
# hub centers on the wheelbase ([tt02]), centered between the body posts. steer_margin: room for the front wheel sweep
track = 160.0
tyre_d = 66.0
tyre_w = 26.0
steer_margin = 10.0
status = "assumed"
source = "tyre 26/66 mm (Tamiya kit page 58716); track at the hub centers estimated from the 182-187 mm width over the tyres; axle positions assume the posts are centered on the wheelbase; owner to measure"

# ---- fasteners -------------------------------------------------------------------------------------------------------
[fasteners]
# m3_insert_hole: hole for an M3 heat-set insert. m25_pilot: hole for an M2.5 thread-forming screw into plastic
m3_insert_hole = 4.0
m3_insert_depth = 5.0
m25_pilot = 2.2
m25_pilot_depth = 5.0
# splice bolts: M3 button head on the deck top, M3 nut under the splice
m3_head_d = 5.7
m3_head_h = 1.65
m3_nut_w = 5.5
m3_nut_h = 2.4
status = "assumed"
source = "generic start values (ISO 7380 button head, ISO 4032 nut, common M3 insert hole); owner to choose the insert and confirm the hole with a test print"
